<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Mock Interview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0b1020;font-family:Arial,Helvetica,sans-serif}
    #loading,#error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;color:#f7f8fb}
    #error{display:none}.card{max-width:560px;background:#151b2e;border:1px solid #2e3956;border-radius:14px;padding:24px}.muted{color:#aeb7ca;font-size:14px;line-height:1.5;margin-top:10px}
  </style>
</head>
<body>
  <div id="loading"><div class="card"><strong>Loading Mock Interview…</strong></div></div>
  <div id="error"><div class="card"><strong>Invalid access link.</strong><div class="muted">Open Mock Interview from the Student or Parent/Admin screen, or use a valid access token.</div></div></div>
  <script>
    (() => {
      const DEPLOYMENT_URL='https://script.google.com/macros/s/AKfycbxpsn8rY-8gLV27Y30HuSOMxUuHbDxxNfrA3CzA0vFIhjwGqcm6Zx-BDr040YaAYHj6/exec';
      const validRoles=['student','reviewer','admin'];
      const url=new URL(location.href);
      const hash=new URLSearchParams(String(url.hash||'').replace(/^#/,''));
      const query=new URLSearchParams(String(url.search||'').replace(/^\?/,''));
      const role=String(hash.get('role')||query.get('role')||'').toLowerCase();
      const token=String(hash.get('token')||query.get('token')||'');
      if(!validRoles.includes(role)||token.length<12){
        document.getElementById('loading').style.display='none';
        document.getElementById('error').style.display='flex';
        return;
      }
      const target=DEPLOYMENT_URL+'?mode=mock&role='+encodeURIComponent(role)+'&token='+encodeURIComponent(token);
      location.replace(target);
    })();
  </script>
</body>
</html>
