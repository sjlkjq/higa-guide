<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<title>HiGA Application Guide</title>
<style>body{font-family:Arial,sans-serif;padding:30px;color:#17212b}#status{font-size:18px}</style>
</head>
<body>
<p id="status">Loading HiGA guide...</p>
<script>
(async()=>{
  try{
    const urls=Array.from({length:8},(_,i)=>`chunks/${String(i+1).padStart(2,'0')}.txt?v=20260910-3`);
    const parts=[];
    for(const u of urls){
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(`${u}: HTTP ${r.status}`);
      parts.push(await r.text());
    }
    document.open();
    document.write(parts.join(''));
    document.close();
  }catch(e){
    document.getElementById('status').textContent='Load failed: '+e.message;
  }
})();
</script>
</body>
</html>
