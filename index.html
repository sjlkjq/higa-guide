<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<title>HiGA Application Guide</title>
<style>body{font-family:Arial,sans-serif;padding:30px;color:#17212b}#status{font-size:18px}</style>
</head>
<body>
<p id="status">Loading HiGA guide...</p>
<script>
function taskHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function setupChecklist(){
  const targetSections=new Set([
    '2-fastest-path-to-submission',
    '3-form-1-correction-matrix',
    '4-form-4-section-1-rescue-plan',
    '5-form-4-section-2-correction-matrix',
    '6-form-5-correction-matrix',
    '9-shimpei-writing-math-action-matrix',
    '10-parent-task-matrix',
    '11-questions-for-sakai-sensei',
    '13-final-submission-checklist'
  ]);
  const boxes=[];
  document.querySelectorAll('h2[id]').forEach(h2=>{
    if(!targetSections.has(h2.id)) return;
    let node=h2.nextElementSibling;
    while(node && node.tagName!=='H2'){
      node.querySelectorAll?.('tbody tr').forEach(row=>{
        const first=row.querySelector('td:first-child');
        if(!first || first.querySelector('.task-check')) return;
        const marker=first.textContent.trim().toUpperCase();
        if(marker.includes('DO NOT')) return;
        const rowText=Array.from(row.querySelectorAll('td')).slice(0,2).map(td=>td.textContent.replace(/\s+/g,' ').trim()).join(' | ');
        if(!rowText) return;
        const key='higa-task-'+taskHash(rowText.toLowerCase());
        const cb=document.createElement('input');
        cb.type='checkbox';
        cb.className='task-check';
        cb.setAttribute('aria-label','Mark task complete');
        cb.dataset.key=key;
        if(marker.includes('OPTIONAL') || marker.includes('ONLY IF') || marker.includes('ASK IF TIME')) cb.dataset.optional='1';
        cb.checked=localStorage.getItem(key)==='1';
        first.prepend(cb);
        const sync=()=>{row.classList.toggle('task-done',cb.checked);updateProgress()};
        cb.addEventListener('change',()=>{localStorage.setItem(key,cb.checked?'1':'0');sync()});
        sync();
        boxes.push(cb);
      });
      node=node.nextElementSibling;
    }
  });
  const main=document.querySelector('main');
  if(main && !document.getElementById('task-progress')){
    const box=document.createElement('div');
    box.id='task-progress';
    box.innerHTML='<strong>Checklist progress</strong> <span id="task-progress-count"></span><div class="task-progress-track"><div id="task-progress-fill"></div></div><small>Saved automatically on this browser. Optional tasks are excluded from the percentage.</small>';
    const h1=main.querySelector('h1');
    if(h1) h1.insertAdjacentElement('afterend',box); else main.prepend(box);
  }
  window._higaTaskBoxes=boxes;
  updateProgress();
}
function updateProgress(){
  const boxes=(window._higaTaskBoxes||[]).filter(cb=>cb.dataset.optional!=='1');
  const done=boxes.filter(cb=>cb.checked).length;
  const total=boxes.length;
  const pct=total?Math.round(done*100/total):0;
  const count=document.getElementById('task-progress-count');
  const fill=document.getElementById('task-progress-fill');
  if(count) count.textContent=`${done} / ${total} (${pct}%)`;
  if(fill) fill.style.width=pct+'%';
}
(async()=>{
  try{
    const urls=[
      'v2chunks/01.txt?v=20260911-1',
      'v2chunks/02.txt?v=20260911-1',
      'v2chunks/03.txt?v=20260911-1',
      'v2chunks/04_05.txt?v=20260911-1',
      'v2chunks/06_07.txt?v=20260911-1',
      'v2chunks/08_09.txt?v=20260911-1',
      'v2chunks/10.txt?v=20260911-1'
    ];
    const parts=[];
    for(const u of urls){
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(`${u}: HTTP ${r.status}`);
      parts.push(await r.text());
    }
    let html=parts.join('');
    html=html.replace('MERGED PREVIEW — not yet published to GitHub.','CURRENT GUIDE — verified sources retained; only necessary corrections are treated as required.');
    html=html.replace('8. Form 5 approximately 2,300-word completion plan','8. Form 5 word-count note');
    html=html.replace('4. Form 4 Section 1 rescue plan','4. Form 4 Section 1 final check');

    const status=`<h2 id="1-executive-status">1. Executive status</h2>
<ul>
<li><strong>Form 1:</strong> nearly complete. No substantive rewrite currently required.</li>
<li><strong>Form 4 Section 1:</strong> almost complete. Add one Formula 9 Pythagorean verification and finish the header.</li>
<li><strong>Form 4 Section 2:</strong> almost complete. Formula No.5 is already correct; add the references actually used and perform the final format check.</li>
<li><strong>Form 5:</strong> the report exists. Remaining work is source/reference repair, missing Findings evidence, the tag-source error, and a short real Evaluation.</li>
</ul>
<div class="notice"><strong>Review standard:</strong> do not polish Shimpei's reasoning to an AI-perfect standard. A simple or imperfect student inference can remain. Required corrections are limited to clear factual/source/requirement errors and material missing parts identified by the tutor.</div>
`;
    html=html.replace(/<h2 id="1-executive-status">[\s\S]*?(?=<h2 id="2-fastest-path-to-submission">)/,status);

    const path=`<h2 id="2-fastest-path-to-submission">2. Current path to submission</h2>
<div class="table-wrap"><table><thead><tr><th>Work</th><th>Current status</th><th>Required next step</th></tr></thead><tbody>
<tr><td>Form 4 S1</td><td>ALMOST COMPLETE</td><td>Add the Formula 9 Pythagorean check; circle geometry; confirm the header.</td></tr>
<tr><td>Form 4 S2</td><td>ALMOST COMPLETE</td><td>Add the references actually used; final page/header check.</td></tr>
<tr><td>Form 5</td><td>MAIN REPAIRS REMAIN</td><td>Fix false/reference attribution, add missing Findings evidence, correct the tag error, and add a short Evaluation.</td></tr>
<tr><td>Form 1</td><td>NEARLY COMPLETE</td><td>Final word-count, signature and layout check.</td></tr>
<tr><td>Final packaging</td><td>AFTER CONTENT LOCK</td><td>A4/page limits, signatures, PDFs and OpenApply upload check.</td></tr>
</tbody></table></div>
`;
    html=html.replace(/<h2 id="2-fastest-path-to-submission">[\s\S]*?(?=<h2 id="3-form-1-correction-matrix">)/,path);

    const form1=`<h2 id="3-form-1-correction-matrix">3. Form 1 — final check</h2>
<p>The current 2nd draft already names <strong>Koh Tao</strong>, fixes the opening sentence structure, and uses the revised university/organization wording. No substantive content rewrite is currently required.</p>
<div class="table-wrap"><table><thead><tr><th>Task</th><th>Action</th></tr></thead><tbody>
<tr><td>FINAL CHECK</td><td>Recount the three answers, confirm each is at least 100 words and the total is no more than 600, then check signatures and layout.</td></tr>
</tbody></table></div>
`;
    html=html.replace(/<h2 id="3-form-1-correction-matrix">[\s\S]*?(?=<h2 id="4-form-4-section-1-rescue-plan">)/,form1);

    const s1=`<h2 id="4-form-4-section-1-rescue-plan">4. Form 4 Section 1 — final check</h2>
<p>The existing <strong>Perimeter_Cal.pdf</strong> work is usable and reaches a perimeter of about 42.3 cm.</p>
<div class="table-wrap"><table><thead><tr><th>Task</th><th>What Shimpei does</th></tr></thead><tbody>
<tr><td>REQUIRED</td><td>Add one short verification using <strong>Formula 9: Pythagorean Theorem</strong> on triangle ABD. Use the AB and AD values already calculated and compare AB² + AD² with BD² = 14².</td></tr>
<tr><td>REQUIRED</td><td>Circle <strong>geometry</strong> and keep Formula No. <strong>9</strong> in the Section 1 header.</td></tr>
</tbody></table></div>
<p>Parent check: confirm this prior schoolwork was completed within the last year.</p>
`;
    html=html.replace(/<h2 id="4-form-4-section-1-rescue-plan">[\s\S]*?(?=<h2 id="5-form-4-section-2-correction-matrix">)/,s1);

    const s2=`<h2 id="5-form-4-section-2-correction-matrix">5. Form 4 Section 2 — final check</h2>
<p><strong>Current status: ALMOST COMPLETE.</strong> Formula No.5 is already correct. The current assumptions, quadratic model, calculations, checks and Strengths &amp; Weaknesses are already present.</p>
<div class="table-wrap"><table><thead><tr><th>Task</th><th>Action</th></tr></thead><tbody>
<tr><td>REQUIRED — references</td><td>Add the sources actually used in the report. For the parabolic-segment area formula use <strong>Weisstein, E. W., “Parabolic Segment,” MathWorld</strong>: <a href="https://mathworld.wolfram.com/ParabolicSegment.html">https://mathworld.wolfram.com/ParabolicSegment.html</a>. For the horseshoe-crab habitat background use the Kasaoka Horseshoe Crab Museum material: <a href="https://www.env.go.jp/content/900514253.pdf">https://www.env.go.jp/content/900514253.pdf</a>.</td></tr>
<tr><td>FINAL CHECK</td><td>Confirm the report stays within the Form 4 Section 2 page limit and that the header/references remain visible in the final PDF.</td></tr>
</tbody></table></div>
<div class="notice">The report may keep Shimpei's own design expectations and interpretations. Do not remove or weaken them merely because a source does not state the same conclusion.</div>
`;
    html=html.replace(/<h2 id="5-form-4-section-2-correction-matrix">[\s\S]*?(?=<h2 id="6-form-5-correction-matrix">)/,s2);

    const form5=`<h2 id="6-form-5-correction-matrix">6. Form 5 — required corrections only</h2>
<div class="notice"><strong>Rule:</strong> keep Shimpei's own analysis unless it contains a clear factual error. When a sentence is Shimpei's inference, the usual fix is to correct the citation/attribution, not to delete the inference.</div>
<div class="table-wrap"><table><thead><tr><th>Location</th><th>Exact required correction</th></tr></thead><tbody>
<tr><td>References</td><td>Replace the invented/reconstructed entries <code>GEF Reports</code>, <code>Kasaoka City Board of Education Official Portal</code>, <code>Document 2-5: Data series...</code>, <code>Conservation Strategy Papers</code> and <code>Ordinance No.12</code> with the verified source records in Section 7. Delete unused Botton &amp; Loveland.</td></tr>
<tr><td>Ordinance</td><td>Change <strong>Ordinance No.12 → No.22</strong>. Where the text cites Article 1 for prohibited disturbance, use the correct provision: Article 5. If named clam/mud-shrimp examples are retained, use the Enforcement Rule source in Section 7.</td></tr>
<tr><td>Analysis — tag paragraph</td><td>Delete the paragraph beginning <code>“Observational data from local fishers shows that roughly half...”</code>. The tags do not identify hatchery origin.</td></tr>
<tr><td>Analysis — measurement wording</td><td>Where the graph data are called <code>adult survival</code>, change this to <strong>adult capture numbers</strong>. The source measures captures, not survival.</td></tr>
<tr><td>Analysis — graph description</td><td>Replace <code>“adult captures remained flat through 2012”</code> with wording that reflects the rise to about 28 in 2012. If <code>&gt;15,000/yr</code> is presented as occurring every year, change it to <strong>over 15,000 in some years</strong>.</td></tr>
<tr><td>Analysis — source attribution</td><td>For sentences such as <code>“This shows that the releases... failed to drive adult recovery (MoE Doc 2-5)”</code>, keep Shimpei's interpretation if he wants it, but remove/reposition the citation so it does not say that MoE itself reached that conclusion. Apply the same rule to <code>“ecological failure”</code> and <code>“physical ceiling”</code> when they are Shimpei's own reasoning.</td></tr>
<tr><td>Artificial spawning grounds</td><td>Current sentence: <code>“Even where artificial spawning grounds have been constructed, these localized patches fail...”</code> The cited source does not report that constructed grounds failed. Change only this factual part to match the source: creating suitable spawning/nursery habitat in the remaining designated area is difficult.</td></tr>
<tr><td>Findings — missing evidence</td><td>Add short Findings paragraphs for the four series already extracted in Section 7A: larval releases, spawning-location data, confirmed larvae and adult captures. Also add the museum's reported positive outcomes from S1 p.19.</td></tr>
<tr><td>Findings — water quality</td><td>Because water-quality improvement is in the RQ, add the verified measures: sewerage-related measures from 1993 and the three-month seawater-purification experiment in 2002.</td></tr>
<tr><td>Findings — national tidal-flat figure</td><td>Keep <strong>51,443 ha</strong> and <strong>3,857 ha</strong>, but cite S6 rather than Material 2-5.</td></tr>
<tr><td>Evaluation</td><td>Rename the current policy-recommendation section <strong>Implications</strong>. Add a short new Evaluation covering: (1) capture counts are not a census, (2) the sources report about 1,841 ha and 1,811 ha, without guessing why, and (3) the study is one-region/literature-based with no fieldwork.</td></tr>
</tbody></table></div>
<p><strong>No required rewrite:</strong> strong wording in Shimpei's own conclusion or habitat-limit reasoning is not automatically an error. Correct it only if it depends on a false fact or false source attribution.</p>
`;
    html=html.replace(/<h2 id="6-form-5-correction-matrix">[\s\S]*?(?=<h2 id="7-form-5-evidence-and-verified-reference-matrix">)/,form5);

    const words=`<h2 id="8-form-5-approximately-2-300-word-completion-plan">8. Form 5 word-count note</h2>
<p>The tutor's approximately <strong>2,300-word</strong> figure is a target, not a HiGA minimum. Do not expand already adequate sections just to reach it. The official <strong>8-page limit including references</strong> remains the controlling requirement.</p>
`;
    html=html.replace(/<h2 id="8-form-5-approximately-2-300-word-completion-plan">[\s\S]*?(?=<h2 id="9-shimpei-writing-math-action-matrix">)/,words);

    const actions=`<h2 id="9-shimpei-writing-math-action-matrix">9. Shimpei — current action list</h2>
<div class="table-wrap"><table><thead><tr><th>Order</th><th>Action</th></tr></thead><tbody>
<tr><td>1</td><td>Finish Form 4 Section 1: Formula 9 Pythagorean check + geometry header.</td></tr>
<tr><td>2</td><td>Finish Form 4 Section 2: add the two relevant references and perform the final page/header check.</td></tr>
<tr><td>3</td><td>Form 5: fix the specific factual/reference errors in Section 6, then add the missing Findings evidence and short Evaluation.</td></tr>
</tbody></table></div>
<p>Use Section 7 for sources and exact reading locations. Reference searching is handled by AI; Shimpei writes his own final text.</p>
`;
    html=html.replace(/<h2 id="9-shimpei-writing-math-action-matrix">[\s\S]*?(?=<h2 id="10-parent-task-matrix">)/,actions);

    const parent=`<h2 id="10-parent-task-matrix">10. 保護者向け作業</h2>
<div class="table-wrap"><table><thead><tr><th>タイミング</th><th>保護者がやること</th></tr></thead><tbody>
<tr><td>作業中</td><td>進捗確認のみ。Source不足やURL不備はChatGPTに確認させる。</td></tr>
<tr><td>内容確定後</td><td>A4、page limit、署名、必須欄、PDF表示、ファイル名を確認する。</td></tr>
<tr><td>提出時</td><td>OpenApplyの正しい項目、学校提出書類、Paymentを最終確認する。</td></tr>
</tbody></table></div>
<p>保護者・心平がReferenceを広く検索する必要はありません。</p>
`;
    html=html.replace(/<h2 id="10-parent-task-matrix">[\s\S]*?(?=<h2 id="11-questions-for-sakai-sensei">)/,parent);

    const tutor=`<h2 id="11-questions-for-sakai-sensei">11. Sakai-sensei review</h2>
<div class="table-wrap"><table><thead><tr><th>Action</th><th>Question</th></tr></thead><tbody>
<tr><td>REVIEW</td><td>Please review the latest Form 4 and Form 5 and identify only any remaining submission blocker or clear factual/source error.</td></tr>
</tbody></table></div>
<p>No need to ask for extra depth comparisons, new topics, or additional polishing unless Sakai-sensei identifies a specific problem.</p>
`;
    html=html.replace(/<h2 id="11-questions-for-sakai-sensei">[\s\S]*?(?=<h2 id="12-do-not-waste-time-list">)/,tutor);

    const waste=`<h2 id="12-do-not-waste-time-list">12. Do not waste time</h2>
<ul>
<li>Do not rewrite acceptable English or student reasoning just to make it more sophisticated.</li>
<li>Do not pad Form 5 to reach approximately 2,300 words.</li>
<li>Do not start a new Form 4 problem, optimisation project or conservation topic.</li>
<li>Do not search broadly for references already verified in Section 7.</li>
<li>Do not reopen completed corrections unless a clear error or tutor-identified blocker appears.</li>
</ul>
`;
    html=html.replace(/<h2 id="12-do-not-waste-time-list">[\s\S]*?(?=<h2 id="13-final-submission-checklist">)/,waste);

    const finalCheck=`<h2 id="13-final-submission-checklist">13. Final submission checklist</h2>
<div class="table-wrap"><table><thead><tr><th>Task</th><th>Ready when</th></tr></thead><tbody>
<tr><td>Form 1</td><td>Official word limits, signatures and layout are correct.</td></tr>
<tr><td>Form 4 S1</td><td>Existing work + Formula 9 verification + geometry header are present.</td></tr>
<tr><td>Form 4 S2</td><td>Current report and references are present, Formula No.5/header are correct, and the page limit is met.</td></tr>
<tr><td>Form 5</td><td>References are real/correct; clear factual/source errors are fixed; missing Findings and a real Evaluation are present; the tag-origin error is removed; page limit is met.</td></tr>
<tr><td>All documents</td><td>Official forms, required fields/signatures, attachments and final PDFs are checked visually.</td></tr>
<tr><td>Application</td><td>Correct OpenApply fields, school submissions and payment are confirmed separately.</td></tr>
</tbody></table></div>
<p><strong>Stop rule:</strong> once the required factual, source, requirement and completeness issues are fixed, stop revising unless a demonstrable error or tutor-identified blocker appears.</p>
`;
    html=html.replace(/<h2 id="13-final-submission-checklist">[\s\S]*?(?=<\/main>)/,finalCheck);

    html=html.replace('</head>','<style>#task-progress{position:sticky;top:0;z-index:20;background:#fff;border:1px solid #c7d4df;padding:12px 14px;margin:12px 0 22px;box-shadow:0 2px 7px rgba(0,0,0,.06)}#task-progress small{display:block;margin-top:5px;color:#4c5b66}.task-progress-track{height:8px;background:#e1e7eb;border-radius:6px;margin-top:7px;overflow:hidden}#task-progress-fill{height:100%;width:0;background:#233c51;transition:width .15s}.task-check{width:18px;height:18px;margin:1px 9px 0 0;vertical-align:top;cursor:pointer}.task-done td{opacity:.58}.task-done td:first-child{text-decoration:line-through}</style></head>');
    document.open();
    document.write(html);
    document.close();
    setupChecklist();
  }catch(e){
    document.getElementById('status').textContent='Load failed: '+e.message;
  }
})();
</script>
</body>
</html>
