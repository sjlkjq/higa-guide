<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Mock Interview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:Arial,Helvetica,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1020}
    #loading,#error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;background:#0b1020;color:#f7f8fb;z-index:2}
    #error{display:none}.card{max-width:560px;background:#151b2e;border:1px solid #2e3956;border-radius:14px;padding:24px}.muted{color:#aeb7ca;font-size:14px;line-height:1.5;margin-top:10px}
  </style>
</head>
<body>
  <div id="loading"><div class="card"><strong>Loading Mock Interview…</strong></div></div>
  <div id="error"><div class="card"><strong>Invalid access link.</strong><div class="muted">Use the same Student/Admin access token used for the HiGA training app.</div></div></div>
  <iframe id="app" title="Mock Interview" referrerpolicy="no-referrer" allow="microphone; clipboard-read; clipboard-write"></iframe>
  <script src="./router.js"></script>
  <script>
    (() => {
      const DEPLOYMENT_URL='https://script.google.com/macros/s/AKfycbxpsn8rY-8gLV27Y30HuSOMxUuHbDxxNfrA3CzA0vFIhjwGqcm6Zx-BDr040YaAYHj6/exec';
      const frame=document.getElementById('app');
      const loading=document.getElementById('loading');
      const error=document.getElementById('error');
      let currentTarget='';
      function applyRoute(){
        const access=HigaPortal.parseAccess(location.href);
        if(!access.valid){
          currentTarget='';frame.removeAttribute('src');loading.style.display='none';error.style.display='flex';return;
        }
        error.style.display='none';loading.style.display='flex';
        const target=DEPLOYMENT_URL+'?mode=mock&role='+encodeURIComponent(access.role)+'&token='+encodeURIComponent(access.token);
        if(target!==currentTarget){currentTarget=target;frame.src=target;}else{loading.style.display='none';}
        if(location.search)history.replaceState(null,'',location.pathname+HigaPortal.canonicalHash(access));
      }
      frame.addEventListener('load',()=>loading.style.display='none');
      window.addEventListener('hashchange',applyRoute);
      window.addEventListener('popstate',applyRoute);
      applyRoute();
    })();
  </script>
</body>
</html>
