<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>HiGA Interview Training</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f8fa;font-family:Arial,Helvetica,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading,#error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;background:#f7f8fa;color:#202124;z-index:2}
    #error{display:none}
    .card{max-width:520px;background:#fff;border:1px solid #dadce0;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .muted{color:#5f6368;font-size:14px;line-height:1.5}
  </style>
</head>
<body>
  <div id="loading"><div class="card"><strong>Loading HiGA Interview Training...</strong></div></div>
  <div id="error"><div class="card"><strong>Invalid access link.</strong><div class="muted" style="margin-top:10px">Open the Student, Reviewer, or Admin link that was shared with you.</div></div></div>
  <iframe id="app" title="HiGA Interview Training" referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write"></iframe>
  <script src="./router.js"></script>
  <script>
    (() => {
      const DEPLOYMENT_URL = 'https://script.google.com/macros/s/AKfycbxpsn8rY-8gLV27Y30HuSOMxUuHbDxxNfrA3CzA0vFIhjwGqcm6Zx-BDr040YaAYHj6/exec';
      const frame = document.getElementById('app');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      let currentTarget = '';

      function applyRoute(){
        const access = HigaPortal.parseAccess(location.href);
        if(!access.valid){
          currentTarget='';
          frame.removeAttribute('src');
          loading.style.display='none';
          error.style.display='flex';
          return;
        }

        error.style.display='none';
        loading.style.display='flex';
        const target=HigaPortal.buildAppUrl(DEPLOYMENT_URL,access);
        if(target!==currentTarget){
          currentTarget=target;
          frame.src=target;
        }else{
          loading.style.display='none';
        }

        if(location.search){
          history.replaceState(null,'',location.pathname+HigaPortal.canonicalHash(access));
        }
      }

      frame.addEventListener('load',()=>{loading.style.display='none';});
      window.addEventListener('hashchange',applyRoute);
      window.addEventListener('popstate',applyRoute);
      applyRoute();
    })();
  </script>
</body>
</html>
