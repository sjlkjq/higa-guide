<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mock Review</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#17202b;--muted:#667085;--line:#dfe4ec;--accent:#315fcb;--test:#8a5a12;--app:#17613b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{margin:0;font-size:28px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn,.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit}.btn{cursor:pointer}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.session{padding:12px;border:1px solid var(--line);border-radius:11px;margin:8px 0;cursor:pointer}.session:hover,.session.active{border-color:#8ea8e8;background:#f7f9ff}.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:700}.tag.applicant{background:#e9f7ef;color:var(--app)}.tag.test{background:#fff3df;color:var(--test)}.q{border-top:1px solid var(--line);padding:14px 0}.q:first-child{border-top:0}.qtitle{font-weight:700;line-height:1.5}.meta{font-size:11px;color:var(--muted);margin:5px 0 8px}.transcript{background:#f8fafc;border:1px solid #e5eaf1;border-radius:9px;padding:10px;font-size:13px;line-height:1.55;white-space:pre-wrap}.empty{text-align:center;color:var(--muted);padding:35px 10px}.warn{color:#9a6700}.bad{color:#b42318}.good{color:#067647}.sttbox{margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.sttrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sttinput{min-width:280px;flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit}.browserstt{margin-top:7px;padding:8px 10px;border-left:3px solid #cbd5e1;background:#f8fafc;font-size:12px;color:var(--muted);white-space:pre-wrap}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:15px 10px 35px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>模擬面接レビュー</h1><div class="muted">Applicant history と Parent/Admin test history は分離されています。</div></div><button class="btn" onclick="window.close()">閉じる</button></div>
  <div class="sttbox">
    <div class="sttrow"><b>録音保存</b><span id="audioStorageStatus" class="muted">確認中…</span><a class="btn" id="authorizeDrive" href="#" target="_blank" rel="noopener" style="display:none;text-decoration:none">Google Driveを承認</a><button class="btn" id="repairAudioStorage" style="display:none">保存先を再確認・修復</button></div>
    <div id="audioStorageDetail" class="muted" style="margin-top:7px"></div>
  </div>
  <div class="sttbox" id="sttConfigBox">
    <div class="sttrow"><b>音声認識</b><span id="sttStatus" class="muted">確認中…</span></div>
    <div id="sttAdminSetup" class="sttrow" style="margin-top:9px;display:none">
      <input id="deepgramKey" class="sttinput" type="password" autocomplete="off" placeholder="Deepgram API Key">
      <button class="btn" id="saveDeepgramKey">API Keyを保存</button>
      <button class="btn" id="clearDeepgramKey">解除</button>
    </div>
    <div class="muted" style="margin-top:7px">Browser STTを優先。Transcriptが空でSpeech detectedの場合のみ、Deepgram Nova-3 multilingual（日本語・英語・混在）で再認識します。</div>
  </div>
  <div class="toolbar">
    <select class="select" id="scope"><option value="all">すべて</option><option value="applicant">本人データのみ</option><option value="test">親/Adminテストのみ</option></select>
    <select class="select" id="profile"><option value="all">心平・栞</option><option value="shimpei">Shimpei</option><option value="shiori">Shiori</option></select>
    <button class="btn" id="reload">再読込</button>
  </div>
  <div class="grid">
    <div class="panel"><div id="sessions"></div></div>
    <div class="panel"><div id="detail" class="empty">左からセッションを選択してください。</div></div>
  </div>
</div>
<script>
const ACCESS=window.__HIGA_ACCESS__||{};
let data={sessions:[],answers:[]},selected='';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gas(name,args=[]){return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script||!google.script.run)return reject(new Error('Apps Script bridge unavailable.'));let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message||String(e))));runner[name](...args);});}
function fmtMs(v){if(v===''||v===null||v===undefined)return '—';const n=Number(v);if(!Number.isFinite(n))return '—';return (n/1000).toFixed(1)+' s';}
function labelProfile(p){return p==='shimpei'?'Shimpei':p==='shiori'?'Shiori':p;}
function renderSessions(){
  const scope=$('scope').value,profile=$('profile').value;
  const rows=data.sessions.filter(s=>(scope==='all'||s.scope===scope)&&(profile==='all'||s.profile===profile));
  $('sessions').innerHTML=rows.length?rows.map(s=>'<div class="session '+(String(s.session_id)===selected?'active':'')+'" data-id="'+esc(s.session_id)+'"><div><span class="tag '+esc(s.scope)+'">'+(s.scope==='applicant'?'APPLICANT':'TEST')+'</span> <b>'+esc(labelProfile(s.profile))+'</b></div><div class="muted" style="margin-top:5px">'+esc(s.started_at||'')+'</div><div class="muted">'+esc(String(s.answers_saved||0))+' answers · '+(s.completed_at?'completed':'incomplete')+'</div></div>').join(''):'<div class="empty">該当セッションはありません。</div>';
  document.querySelectorAll('.session').forEach(el=>el.onclick=()=>{selected=el.dataset.id;renderSessions();renderDetail();});
}
function renderDetail(){
  const s=data.sessions.find(x=>String(x.session_id)===String(selected));if(!s){$('detail').innerHTML='<div class="empty">左からセッションを選択してください。</div>';return;}
  const answers=data.answers.filter(a=>String(a.session_id)===String(selected)).sort((a,b)=>String(a.started_at||'').localeCompare(String(b.started_at||'')));
  let html='<div><span class="tag '+esc(s.scope)+'">'+(s.scope==='applicant'?'APPLICANT':'TEST')+'</span> <b>'+esc(labelProfile(s.profile))+'</b></div>';
  html+='<div class="muted" style="margin:7px 0 13px">'+esc(s.started_at||'')+' → '+esc(s.completed_at||'incomplete')+'</div>';
  const missingWithAudio=answers.filter(a=>!String(a.transcript||'').trim()&&String(a.audio_file_id||'').trim()).length;
  if((data.role||ACCESS.role)==='admin'&&missingWithAudio){
    html+='<div style="margin:0 0 13px"><button class="btn retranscribeMissing" data-scope="'+esc(s.scope)+'" data-session="'+esc(s.session_id)+'">欠損Transcriptを録音から再生成 ('+missingWithAudio+')</button> <span class="meta">Deepgram設定済みの場合のみ実行</span>'+(data.stt_config&&data.stt_config.configured?'':' <button class="btn openDeepgramSetup" type="button">Deepgram API Keyを設定</button>')+'</div>';
  }
  html+=answers.length?answers.map((a,i)=>{
    const q=a.question||{};const speech=a.speech_detected===true||String(a.speech_detected).toLowerCase()==='true';
    return '<div class="q"><div class="qtitle">'+(i+1)+'. '+esc(q.question_text||a.question_id)+'</div>'+
      '<div class="meta">Response start: '+fmtMs(a.response_latency_ms)+' · Answer: '+fmtMs(a.answer_duration_ms)+' · Longest internal pause: '+fmtMs(a.longest_internal_silence_ms)+' · Speech: '+(speech?'detected':'not detected')+'</div>'+
      '<div class="meta">STT: '+esc(a.stt_provider||'legacy')+(a.stt_model?' · '+esc(a.stt_model):'')+(a.stt_language_mode?' · mode '+esc(a.stt_language_mode):'')+(a.stt_detected_language?' · detected '+esc(a.stt_detected_language):'')+(a.stt_confidence!==''&&a.stt_confidence!==undefined?' · confidence '+esc(Number(a.stt_confidence).toFixed(2)):'')+(a.stt_status?' · '+esc(a.stt_status):'')+'</div>'+
      '<div class="transcript">'+(a.transcript?esc(a.transcript):'<span class="bad">Transcriptなし</span>')+'</div>'+
      (a.browser_transcript&&String(a.browser_transcript)!==String(a.transcript)?'<div class="browserstt"><b>Browser STT (diagnostic)</b><br>'+esc(a.browser_transcript)+'</div>':'')+
      (a.audio_file_id?'<div style="margin-top:8px"><button class="btn playAudio" data-file="'+esc(a.audio_file_id)+'">▶ 回答音声を再生</button> <span class="meta good">録音保存済み'+(a.audio_bytes?' · '+esc(a.audio_bytes)+' bytes':'')+'</span></div>':'<div class="meta '+(a.audio_error?'bad':'warn')+'">録音なし'+(a.audio_status?' · '+esc(a.audio_status):'')+(a.audio_error?' · '+esc(a.audio_error):'')+'</div>')+
      (a.recognition_error?'<div class="meta bad">Speech recognition error: '+esc(a.recognition_error)+'</div>':'')+'</div>';
  }).join(''):'<div class="empty">回答データはありません。</div>';
  $('detail').innerHTML=html;
  document.querySelectorAll('.openDeepgramSetup').forEach(btn=>btn.onclick=()=>{const box=$('sttConfigBox');if(box){box.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{$('deepgramKey').focus();},450);}});
  document.querySelectorAll('.retranscribeMissing').forEach(btn=>btn.onclick=async()=>{
    const original=btn.textContent;btn.disabled=true;btn.textContent='再生成中…';
    try{
      const r=await gas('mockRetranscribeMissing',[ACCESS.token,ACCESS.role||'admin',btn.dataset.scope,btn.dataset.session]);
      if(!r||!r.ok)throw new Error(r&&r.error||'Re-transcription failed');
      btn.textContent='完了: '+r.rescued+'/'+r.processed+'件';
      await load();
    }catch(e){
      btn.disabled=false;btn.textContent='再生成失敗: '+e.message;
    }
  });
  document.querySelectorAll('.playAudio').forEach(btn=>btn.onclick=async()=>{
    const original=btn.textContent;btn.disabled=true;btn.textContent='Loading…';
    try{
      const r=await gas('mockGetAudio',[ACCESS.token,ACCESS.role||'admin',btn.dataset.file]);
      if(!r||!r.ok)throw new Error(r&&r.error||'Audio load failed');
      const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));
      const url=URL.createObjectURL(new Blob([bytes],{type:r.mime_type||'audio/webm'}));
      const audio=new Audio(url);audio.onended=()=>{URL.revokeObjectURL(url);btn.disabled=false;btn.textContent=original;};audio.onerror=()=>{URL.revokeObjectURL(url);btn.disabled=false;btn.textContent=original;};await audio.play();
    }catch(e){btn.disabled=false;btn.textContent='再生失敗';setTimeout(()=>btn.textContent=original,1500);}
  });
}
function renderSttStatus(){
  const c=data.stt_config||{};
  $('sttStatus').textContent=c.configured?'Deepgram multilingual rescue: configured':'Deepgram rescue: not configured — browser STT only';
  $('sttStatus').className=c.configured?'good':'warn';
  if((data.role||ACCESS.role)==='admin')$('sttAdminSetup').style.display='flex';
}
async function loadAudioStorageStatus(repair=false){
  const status=$('audioStorageStatus'),detail=$('audioStorageDetail'),btn=$('repairAudioStorage'),authBtn=$('authorizeDrive');
  const isAdmin=(data.role||ACCESS.role)==='admin';
  btn.style.display=isAdmin?'inline-block':'none';authBtn.style.display='none';authBtn.href='#';
  status.textContent=repair?'修復中…':'確認中…';status.className='muted';detail.textContent='';
  try{
    const r=await gas('mockAudioStorageStatus',[ACCESS.token,ACCESS.role||'admin',repair]);
    if(!r||!r.ok)throw new Error(r&&r.error||'Audio storage check failed');
    if(r.authorization_required){
      status.textContent='Google Drive 承認が必要';status.className='bad';
      detail.textContent='録音保存を使う前に、Apps Scriptの所有者がDrive権限を一度承認する必要があります。承認後、この画面に戻って「保存先を再確認・修復」を押してください。';
      if(isAdmin&&r.authorization_url){authBtn.href=r.authorization_url;authBtn.style.display='inline-block';}
    }else if(r.writable){
      status.textContent='Google Drive 保存可能';status.className='good';
      detail.innerHTML='保存先: '+esc(r.folder_name||'HiGA Mock Interview Audio')+(r.repaired?'（この実行で再作成）':'')+(r.folder_url?' · <a href="'+esc(r.folder_url)+'" target="_blank" rel="noopener">Driveを開く</a>':'');
    }else{
      status.textContent='保存不可';status.className='bad';
      detail.textContent=r.error||'Google Driveに書き込めません。';
    }
  }catch(e){status.textContent='確認失敗';status.className='bad';detail.textContent=e.message;}
}
async function saveDeepgramKey(clear=false){
  const key=clear?'':String($('deepgramKey').value||'').trim();
  if(!clear&&!key){$('sttStatus').textContent='API Keyを入力してください。';$('sttStatus').className='bad';return;}
  $('saveDeepgramKey').disabled=true;$('clearDeepgramKey').disabled=true;
  try{
    const r=await gas('mockSetDeepgramApiKey',[ACCESS.token,ACCESS.role||'admin',key]);
    if(!r||!r.ok)throw new Error(r&&r.error||'Save failed');
    $('deepgramKey').value='';
    await load();
  }catch(e){$('sttStatus').textContent='Deepgram設定エラー: '+e.message;$('sttStatus').className='bad';}
  finally{$('saveDeepgramKey').disabled=false;$('clearDeepgramKey').disabled=false;}
}
async function load(){
  $('sessions').innerHTML='<div class="empty">Loading…</div>';
  try{
    const r=await gas('mockReviewBootstrap',[ACCESS.token,ACCESS.role||'admin']);if(!r||!r.ok)throw new Error(r&&r.error||'Load failed');
    data=r;selected='';renderSttStatus();renderSessions();renderDetail();
    await loadAudioStorageStatus((data.role||ACCESS.role)==='admin');
  }
  catch(e){$('sessions').innerHTML='<div class="empty bad">'+esc(e.message)+'</div>';}
}
$('scope').onchange=renderSessions;$('profile').onchange=renderSessions;$('reload').onclick=load;$('saveDeepgramKey').onclick=()=>saveDeepgramKey(false);$('clearDeepgramKey').onclick=()=>saveDeepgramKey(true);$('repairAudioStorage').onclick=()=>loadAudioStorageStatus(true);load();
</script>
</body>
</html>
