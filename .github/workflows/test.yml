name: Test HiGA Interview App

on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'index.html'
      - 'app.html'
      - 'site/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unit and integration tests
        run: npm test
