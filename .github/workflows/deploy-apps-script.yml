name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'index.html'
      - 'MockInterview.html'
      - 'MockReview.html'
      - 'AdminJa.html'
      - 'appsscript.json'
      - '.claspignore'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run unit and integration tests
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp@latest

      - name: Restore clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configure Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$APPS_SCRIPT_ID"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Verify clasp authentication
        run: clasp show-authorized-user

      - name: Push source
        run: clasp push --force

      - name: Redeploy existing web app
        run: clasp create-deployment --deploymentId AKfycbxpsn8rY-8gLV27Y30HuSOMxUuHbDxxNfrA3CzA0vFIhjwGqcm6Zx-BDr040YaAYHj6 --description "GitHub ${GITHUB_SHA::7}"

      - name: Smoke test deployed web app
        env:
          HEALTH_URL: https://script.google.com/macros/s/AKfycbxpsn8rY-8gLV27Y30HuSOMxUuHbDxxNfrA3CzA0vFIhjwGqcm6Zx-BDr040YaAYHj6/exec?mode=mockhealth
        run: |
          body="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "$HEALTH_URL")"
          printf '%s\n' "$body"
          BODY="$body" node - <<'NODE'
          const data=JSON.parse(process.env.BODY);
          if(data.ok!==true) throw new Error('Health endpoint did not return ok=true');
          if(typeof data.drive_authorized!=='boolean') throw new Error('drive_authorized must be boolean');
          if(!['REQUIRED','NOT_REQUIRED'].includes(String(data.authorization_status))) throw new Error('Unexpected authorization_status: '+data.authorization_status);
          if(!/^1\.7\./.test(String(data.app_version||''))) throw new Error('Unexpected app_version: '+data.app_version);
          console.log('Production health verified:', data);
          NODE
