name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'index.html'
      - 'appsscript.json'
      - '.claspignore'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run unit and integration tests
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp@latest

      - name: Restore clasp login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configure Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$APPS_SCRIPT_ID"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json

      - name: Verify clasp authentication
        run: clasp show-authorized-user

      - name: Push source
        run: clasp push --force

      - name: Redeploy existing web app
        run: clasp create-deployment --deploymentId AKfycbxpsn8rY-8gLV27Y30HuSOMxUuHbDxxNfrA3CzA0vFIhjwGqcm6Zx-BDr040YaAYHj6 --description "GitHub ${GITHUB_SHA::7}"
