name: Patch student feedback UI

on:
  push:
    paths:
      - '.github/workflows/patch-student-feedback-ui.yml'
      - 'scripts/patch_student_feedback.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch index.html
        run: python3 scripts/patch_student_feedback.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show actionable reviewer feedback to students"
          git push origin main
