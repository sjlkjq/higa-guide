name: Fix index syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix malformed newline regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          broken="replace(/\n/g,'<br>')"
          fixed=r"replace(/\n/g,'<br>')"
          if broken not in s:
              raise SystemExit('Broken regex pattern not found')
          s=s.replace(broken,fixed)
          p.write_text(s)
          PY

      - name: Verify inline JavaScript parses
        run: |
          node - <<'JS'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).join('\n');
          new vm.Script(scripts,{filename:'index-inline.js'});
          console.log('Inline JavaScript syntax OK');
          JS

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix browser syntax in feedback UI"
          git push origin main
